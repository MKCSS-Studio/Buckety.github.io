    <!-- HERO TEXT ------------------------------------------------------------------>
    <main class="hero">
      <p class="stage-text">· Pre-Seed Stage</p>
      <h1>
        <em>Buckety</em> is now on
        <a
          href="https://testflight.apple.com/join/uED8Nket"
          target="_blank"
          rel="noopener"
          >TestFlight</a
        >
        for MacOS beta testing!
      </h1>

      <form
        class="signup"
        id="signup"
        action="https://api.staticforms.dev/submit"
        method="post"
      >
        <input type="hidden" name="apiKey" value="sf_14b4cf5642405d8f3a039092" />
        <input type="hidden" name="subject" value="MKCSS submission" />
        <input type="text" name="honeypot" autocomplete="off" tabindex="-1" hidden />
        <input
          class="email"
          id="email"
          name="email"
          type="email"
          placeholder="Your email address"
          autocomplete="email"
          aria-label="Email address"
          maxlength="254"
          required
        />
        <button class="glass-btn glass-btn--pink" type="submit">
          Request Token
        </button>
      </form>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
